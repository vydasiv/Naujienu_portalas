<!doctype html>
<html lang="lt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="HTML, CSS">
    <meta name="description" content="Naujienų portalo registracija">
    <meta name="author" content="vydas">
    <title>Registracija</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="stiliaus.css" rel="stylesheet">
    <link href="reg.css" rel="stylesheet">
</head>

<body class="text-center">
    <main class="register w-100 m-auto">
        <form method="post">
            <img class="mb-4" src="../news_logo_transp.png" alt="Naujienų portalas" width="120" height="50">
            <h3 class="h3 mb-3 fw-normal"><b>Registracija</b></h3>

            <div class="form-floating">
                <input type="text" class="form-control" id="username" name="username" placeholder="Vardas" required>
                <label for="username">Vardas</label>
            </div>

            <div class="form-floating password-field">
                <input type="password" class="form-control" id="password" name="password" placeholder="Slaptažodis" required>
                <label for="password">Slaptažodis</label>
                <i class="bi bi-eye-slash toggle-password" id="togglePassword" role="button" tabindex="0" aria-label="Rodyti slaptažodį"></i>
            </div>

            <div class="form-floating">
                <input type="password" class="form-control" id="passwordRepeat" name="passwordRepeat" placeholder="Pakartoti slaptažodį" required>
                <label for="passwordRepeat">Pakartoti slaptažodį</label>
            </div>

            <button class="btn btn-primary btn-sm" type="button" onclick="location.href='reg_sekminga.html';">Registruotis</button>

            <div class="copy">
                <hr>
                <p class="mt-3 mb-3 text-muted"><small>&copy;vydas 2022</small></p>
            </div>
        </form>
    </main>

    <script>
        const togglePassword = document.querySelector("#togglePassword");
        const password = document.querySelector("#password");

        function togglePasswordVisibility() {
            const type = password.getAttribute("type") === "password" ? "text" : "password";
            password.setAttribute("type", type);
            togglePassword.classList.toggle("bi-eye");
            togglePassword.classList.toggle("bi-eye-slash");
            togglePassword.setAttribute("aria-label", type === "password" ? "Rodyti slaptažodį" : "Slėpti slaptažodį");
        }

        togglePassword.addEventListener("click", togglePasswordVisibility);
        togglePassword.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {
                event.preventEvent();
                togglePasswordVisibility();
            }
        });

        document.querySelector("form").addEventListener("submit", function (event) {
            event.preventDefault();
        });
    </script>
</body>
</html>
